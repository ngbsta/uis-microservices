spring.application.name=lectures-service

# DEFAULT: H2 in-memory database -> runs in VS Code with no Docker, no setup.
spring.datasource.url=jdbc:h2:mem:lecturesdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8083

# inter-service communication target (lectures -> exam-registration)
examregistration.base-url=http://localhost:8081

# For PostgreSQL run with:  -Dspring-boot.run.profiles=postgres
